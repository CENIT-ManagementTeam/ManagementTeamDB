<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>(주)쎄니트 철강사업부 - HRIS 웹보드</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans">

  <!-- 상단 네비게이션 -->
  <header class="bg-slate-900 text-white shadow-md">
    <div class="max-w-7xl mx-mx auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i class="fa-solid me-2 fa-building-user text-blue-400 text-2xl"></i>
        <h1 class="text-xl font-bold tracking-wide">(주)쎄니트 의령본사 인사관리시스템</h1>
      </div>
      <div class="text-sm text-slate-400">
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 mr-2"></span>관리팀 전용
      </div>
    </div>
  </header>

  <div class="max-w-7xl mx-auto px-6 py-8">
    <!-- 탭 메뉴 -->
    <div class="flex space-x-2 border-b border-slate-300 mb-6">
      <button onclick="switchTab('직원명부')" id="tab-직원명부" class="tab-btn px-5 py-3 font-semibold text-blue-600 border-b-2 border-blue-600 focus:outline-none flex items-center gap-2">
        <i class="fa-solid fa-users"></i> 직원명부
      </button>
      <button onclick="switchTab('급여관리')" id="tab-급여관리" class="tab-btn px-5 py-3 font-semibold text-slate-500 hover:text-slate-800 focus:outline-none flex items-center gap-2">
        <i class="fa-solid fa-file-invoice-dollar"></i> 급여관리
      </button>
      <button onclick="switchTab('휴가관리')" id="tab-휴가관리" class="tab-btn px-5 py-3 font-semibold text-slate-500 hover:text-slate-800 focus:outline-none flex items-center gap-2">
        <i class="fa-solid fa-calendar-check"></i> 휴가관리
      </button>
      <button onclick="switchTab('징계/포상')" id="tab-징계/포상" class="tab-btn px-5 py-3 font-semibold text-slate-500 hover:text-slate-800 focus:outline-none flex items-center gap-2">
        <i class="fa-solid fa-award"></i> 징계/포상
      </button>
    </div>

    <!-- 컨트롤 바 (검색 및 마스킹 토글) -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input type="text" id="searchInput" onkeyup="filterData()" placeholder="사번, 성명, 부서 검색..." class="pl-9 pr-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm w-64">
        </div>
        <button onclick="loadData()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium rounded-lg transition">
          <i class="fa-solid fa-rotate-right mr-1"></i> 새로고침
        </button>
      </div>

      <!-- 마스킹 온오프 토글 버튼 -->
      <div id="maskingControl" class="flex items-center gap-2 bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-200">
        <span class="text-xs font-semibold text-slate-600">주민/외국인번호 마스킹:</span>
        <button id="maskBtn" onclick="toggleMasking()" class="px-3 py-1 bg-rose-500 text-white text-xs font-bold rounded shadow-sm hover:bg-rose-600 transition flex items-center gap-1">
          <i class="fa-solid fa-eye-slash"></i> <span id="maskBtnText">보안 적용 (ON)</span>
        </button>
      </div>
    </div>

    <!-- 데이터 테이블 영역 -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-600">
          <thead id="tableHeader" class="bg-slate-50 text-slate-700 font-bold border-b border-slate-200">
            <!-- Dynamic Header -->
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-100">
            <tr>
              <td colspan="10" class="text-center py-12 text-slate-400">
                <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2 block"></i> 데이터를 불러오는 중입니다...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // ---------------------------------------------------------------- //
    // ★ 1단계에서 복사한 앱스 스크립트 웹앱 URL을 아래에 넣으세요 ★
    const API_URL = "https://script.google.com/macros/s/AKfycbz2ds7Fl-0QYqSq7P3RiYrOMrBovuvIgC8dpZNbBranfEONVj_44A2Up3V5KA4fxxlu/exec"; 
    // ---------------------------------------------------------------- //

    let currentTab = "직원명부";
    let rawData = [];
    let isMasked = true; // 기본 마스킹 ON

    window.onload = function() {
      loadData();
    };

    function switchTab(tabName) {
      currentTab = tabName;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('text-blue-600', 'border-b-2', 'border-blue-600');
        btn.classList.add('text-slate-500');
      });
      document.getElementById(`tab-${tabName}`).classList.add('text-blue-600', 'border-b-2', 'border-blue-600');
      document.getElementById(`tab-${tabName}`).classList.remove('text-slate-500');

      // 직원명부일 때만 마스킹 토글 표시
      document.getElementById('maskingControl').style.display = (tabName === '직원명부') ? 'flex' : 'none';

      loadData();
    }

    function loadData() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = `<tr><td colspan="10" class="text-center py-12 text-slate-400"><i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2 block"></i> ${currentTab} 불러오는 중...</td></tr>`;

      fetch(`${API_URL}?sheet=${encodeURIComponent(currentTab)}`)
        .then(res => res.json())
        .then(res => {
          if (res.status === 'success') {
            rawData = res.data;
            renderTable(rawData);
          } else {
            tbody.innerHTML = `<tr><td colspan="10" class="text-center py-8 text-rose-500">오류 발생: ${res.message}</td></tr>`;
          }
        })
        .catch(err => {
          tbody.innerHTML = `<tr><td colspan="10" class="text-center py-8 text-rose-500">통신 오류가 발생했습니다. API URL을 확인하세요.</td></tr>`;
        });
    }

    function renderTable(data) {
      const thead = document.getElementById('tableHeader');
      const tbody = document.getElementById('tableBody');

      if (data.length === 0) {
        thead.innerHTML = '';
        tbody.innerHTML = `<tr><td colspan="10" class="text-center py-8 text-slate-400">등록된 데이터가 없습니다.</td></tr>`;
        return;
      }

      // 동적 헤더 생성
      const headers = Object.keys(data[0]);
      thead.innerHTML = `<tr>${headers.map(h => `<th class="px-4 py-3 bg-slate-100">${h}</th>`).join('')}</tr>`;

      // 동적 행 생성
      tbody.innerHTML = data.map(row => {
        return `<tr class="hover:bg-slate-50 transition">${headers.map(h => {
          let val = row[h] !== undefined ? row[h] : '';
          
          // 주민/외국인등록번호 마스킹 처리
          if (h.includes('주민등록번호') || h.includes('외국인등록번호')) {
            val = maskIdNumber(val, isMasked);
          }
          return `<td class="px-4 py-3 border-t border-slate-100">${val}</td>`;
        }).join('')}</tr>`;
      }).join('');
    }

    function maskIdNumber(str, masked) {
      if (!str) return '';
      const cleanStr = String(str).trim();
      if (!masked) return cleanStr; // Off일 때는 원본
      
      // 앞 6자리-뒷자리 가리기
      if (cleanStr.includes('-')) {
        const parts = cleanStr.split('-');
        return `${parts[0]}-${parts[1].substring(0,1)}******`;
      } else if (cleanStr.length >= 13) {
        return `${cleanStr.substring(0,6)}-${cleanStr.substring(6,7)}******`;
      }
      return cleanStr;
    }

    function toggleMasking() {
      if (isMasked) {
        const password = prompt("보안 해제를 위해 관리자 비밀번호를 입력하세요:");
        if (password === "1234") { // 실무용 비밀번호 설정 가능
          isMasked = false;
          document.getElementById('maskBtn').classList.replace('bg-rose-500', 'bg-emerald-500');
          document.getElementById('maskBtnText').innerText = "보안 해제됨 (OFF)";
        } else if (password !== null) {
          alert("비밀번호가 올바르지 않습니다.");
        }
      } else {
        isMasked = true;
        document.getElementById('maskBtn').classList.replace('bg-emerald-500', 'bg-rose-500');
        document.getElementById('maskBtnText').innerText = "보안 적용 (ON)";
      }
      renderTable(rawData);
    }

    function filterData() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = rawData.filter(row => {
        return Object.values(row).some(val => String(val).toLowerCase().includes(q));
      });
      renderTable(filtered);
    }
  </script>
</body>
</html>
