<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>(주)쎄니트 의령본사 인사관리시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // ==========================================
        // 🛠️ [중요] 구글 앱스 스크립트 웹앱 URL 입력부 (맨 상단 위치)
        // ==========================================
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbydC_Yh4SEhdtmVGUUq_6dX949PKOKgTOYNTZJtbMJ5zcu4gVkj8KNyXjtcfeSF3MJG/exec"; 
    </script>
    <style>
        #loginOverlay { display: flex; }
        #loginOverlay.hidden { display: none !important; }
        #hrModal { display: none; }
        #hrModal.show { display: flex !important; }
        #loadingModal { display: none; }
        #loadingModal.show { display: flex !important; }
        #customAlertModal { display: none; }
        #customAlertModal.show { display: flex !important; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .tab-btn.active { border-bottom-color: #2563eb; color: #2563eb; font-weight: 800; }
    </style>
</head>
<body class="bg-slate-50 p-8 text-slate-800 font-sans relative min-h-screen">

<!-- 파란색 전체 배경 로그인 오버레이 -->
<div id="loginOverlay" class="fixed inset-0 bg-blue-600 z-[99999] flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-3xl p-8 shadow-2xl text-center">
        <h2 class="text-2xl font-black text-slate-900 mb-2">(주)쎄니트 의령본사</h2>
        <p class="text-xs text-slate-400 mb-6 font-bold">관리팀 통합 DB 로그인</p>
        <div class="space-y-4 text-left mb-6">
            <div><label class="block text-xs font-bold text-slate-500 mb-1">ID</label><input type="text" id="loginId" class="w-full border border-slate-200 rounded-xl px-4 py-3 outline-none text-sm" autocomplete="off"></div>
            <div><label class="block text-xs font-bold text-slate-500 mb-1">Password</label><input type="password" id="loginPw" class="w-full border border-slate-200 rounded-xl px-4 py-3 outline-none text-sm" autocomplete="off"></div>
        </div>
        <button onclick="handleLogin()" id="loginBtn" class="w-full bg-blue-600 text-white py-3.5 rounded-xl font-bold text-sm shadow-md hover:bg-blue-700 transition">로그인</button>
    </div>
</div>

<!-- 로딩 모달 -->
<div id="loadingModal" class="fixed inset-0 bg-slate-950/60 z-[999999] backdrop-blur-sm items-center justify-center p-4">
    <div class="bg-white px-8 py-6 rounded-3xl shadow-2xl flex items-center gap-4">
        <div class="w-6 h-6 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
        <p id="loadingText" class="text-sm font-bold text-slate-800">저장 중...</p>
    </div>
</div>

<!-- 커스텀 System Message 모달 -->
<div id="customAlertModal" class="fixed inset-0 bg-slate-950/60 z-[999999] backdrop-blur-sm items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl text-center">
        <p class="text-xs font-black text-blue-600 tracking-wider mb-1">System Message</p>
        <p id="alertMessageText" class="text-sm font-bold text-slate-800 my-4">메시지 내용</p>
        <button onclick="closeCustomAlert()" class="w-full bg-slate-900 text-white py-3 rounded-xl font-bold text-xs hover:bg-slate-800 transition">확인</button>
    </div>
</div>

<div class="max-w-[1600px] mx-auto pb-24">
    <header class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-700 to-indigo-600">🏢 (주)쎄니트 의령본사 인사관리시스템</h1>
            <p class="text-slate-500 mt-1 font-medium text-sm">철강사업부 관리팀 전용 실시간 인력 및 노무관리 플랫폼</p>
        </div>
        <div class="flex gap-2 items-center">
            <span id="currentUserDisplay" class="text-xs font-bold text-slate-600 bg-white px-3 py-2 rounded-xl border border-slate-200 shadow-sm"></span>
            <button onclick="fetchAllData()" class="bg-slate-200 text-slate-700 px-4 py-3 rounded-2xl font-bold hover:bg-slate-300 transition-all text-xs">🔄 새로고침</button>
            <button onclick="handleLogout()" class="bg-rose-100 text-rose-700 px-4 py-3 rounded-2xl font-bold hover:bg-rose-200 transition-all text-xs">🚪 로그아웃</button>
        </div>
    </header>

    <!-- 4대 탭 메뉴 -->
    <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
        <div class="flex gap-4">
            <button onclick="switchTab('emp')" id="btn-emp" class="tab-btn active px-4 py-2 border-b-4 border-transparent text-slate-500 font-bold text-sm">직원명부</button>
            <button onclick="switchTab('salary')" id="btn-salary" class="tab-btn px-4 py-2 border-b-4 border-transparent text-slate-500 font-bold text-sm">급여관리</button>
            <button onclick="switchTab('vacation')" id="btn-vacation" class="tab-btn px-4 py-2 border-b-4 border-transparent text-slate-500 font-bold text-sm">휴가관리</button>
            <button onclick="switchTab('discipline')" id="btn-discipline" class="tab-btn px-4 py-2 border-b-4 border-transparent text-slate-500 font-bold text-sm">징계/포상</button>
        </div>
        <div>
            <button onclick="toggleMask()" id="maskBtn" class="bg-rose-600 text-white px-4 py-2 rounded-xl font-bold text-xs shadow-sm">🔒 보안 적용 (ON)</button>
        </div>
    </div>

    <!-- 1. 직원명부 탭 -->
    <div id="tab-emp" class="tab-content active space-y-4">
        <!-- 필터 및 정렬 바 -->
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-wrap justify-between items-center gap-4 text-xs font-semibold">
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2">
                    <span class="text-slate-500">부서 필터:</span>
                    <select id="deptFilter" onchange="renderEmpTable()" class="border border-slate-200 rounded-lg px-3 py-1.5 outline-none bg-slate-50">
                        <option value="전체">전체</option>
                    </select>
                </div>
                <label class="flex items-center gap-1.5 cursor-pointer">
                    <input type="checkbox" id="excludeResigned" onchange="renderEmpTable()" class="rounded border-slate-300 text-blue-600" checked>
                    <span class="text-slate-600">퇴사자 제외</span>
                </label>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-slate-500">정렬 기준:</span>
                <select id="sortCriteria" onchange="renderEmpTable()" class="border border-slate-200 rounded-lg px-3 py-1.5 outline-none bg-slate-50">
                    <option value="name">성명순</option>
                    <option value="hireDate">입사일순</option>
                    <option value="empId">사번순</option>
                </select>
            </div>
        </div>

        <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-x-auto">
            <table class="w-full text-left whitespace-nowrap">
                <thead class="bg-slate-900 text-white text-xs font-bold text-center">
                    <tr>
                        <th class="p-4">사번</th>
                        <th class="p-4 text-left pl-8">성명 (부서/공정/직급)</th>
                        <th class="p-4">주민등록번호</th>
                        <th class="p-4">입사일</th>
                        <th class="p-4">재직상태</th>
                        <th class="p-4">급여형태</th>
                        <th class="p-4">관리</th>
                    </tr>
                </thead>
                <tbody id="empTableBody" class="divide-y divide-slate-100 text-sm font-medium text-slate-700 text-center"></tbody>
            </table>
        </div>
    </div>

    <!-- 2. 급여관리 탭 -->
    <div id="tab-salary" class="tab-content">
        <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-x-auto">
            <table class="w-full text-left whitespace-nowrap">
                <thead class="bg-slate-900 text-white text-xs font-bold text-center">
                    <tr>
                        <th class="p-4">사번</th>
                        <th class="p-4">성명</th>
                        <th class="p-4">귀속연월</th>
                        <th class="p-4">급여형태</th>
                        <th class="p-4">기본급</th>
                        <th class="p-4">연장근로수당</th>
                        <th class="p-4">야간근로수당</th>
                        <th class="p-4">휴일근로수당</th>
                        <th class="p-4">직책수당</th>
                        <th class="p-4">지급총액</th>
                    </tr>
                </thead>
                <tbody id="salaryTableBody" class="divide-y divide-slate-100 text-sm font-medium text-slate-700 text-center"></tbody>
            </table>
        </div>
    </div>

    <!-- 3. 휴가관리 탭 -->
    <div id="tab-vacation" class="tab-content">
        <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-x-auto">
            <table class="w-full text-left whitespace-nowrap">
                <thead class="bg-slate-900 text-white text-xs font-bold text-center">
                    <tr>
                        <th class="p-4">사번</th>
                        <th class="p-4">성명</th>
                        <th class="p-4">귀속연도</th>
                        <th class="p-4">휴가구분</th>
                        <th class="p-4">사용시간</th>
                        <th class="p-4">휴가시작일</th>
                        <th class="p-4">휴가종료일</th>
                        <th class="p-4">휴가사유</th>
                    </tr>
                </thead>
                <tbody id="vacationTableBody" class="divide-y divide-slate-100 text-sm font-medium text-slate-700 text-center"></tbody>
            </table>
        </div>
    </div>

    <!-- 4. 징계/포상 탭 -->
    <div id="tab-discipline" class="tab-content">
        <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-x-auto">
            <table class="w-full text-left whitespace-nowrap">
                <thead class="bg-slate-900 text-white text-xs font-bold text-center">
                    <tr>
                        <th class="p-4">사번</th>
                        <th class="p-4">성명</th>
                        <th class="p-4">구분</th>
                        <th class="p-4">종류</th>
                        <th class="p-4">처분일자</th>
                        <th class="p-4">사유</th>
                        <th class="p-4">조치내용</th>
                    </tr>
                </thead>
                <tbody id="disciplineTableBody" class="divide-y divide-slate-100 text-sm font-medium text-slate-700 text-center"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- 플로팅 신규 등록 버튼 -->
<button id="floatingAddBtn" onclick="openForm(-1)" class="fixed bottom-8 right-8 bg-blue-600 hover:bg-blue-700 text-white font-black px-6 py-4 rounded-full shadow-2xl transition-all z-50 flex items-center gap-2 text-sm">
    + 신규 입사자 등록
</button>

<!-- 정보 입력/수정 모달 -->
<div id="hrModal" class="fixed inset-0 bg-slate-900/60 z-[99999] backdrop-blur-sm items-center justify-center p-4">
    <div class="bg-white w-full max-w-lg rounded-3xl p-8 shadow-2xl max-h-[90vh] overflow-y-auto">
        <h3 id="formTitle" class="text-2xl font-bold mb-6 text-slate-900">직원 정보 입력</h3>
        <div class="grid grid-cols-2 gap-4">
            <div><label class="block text-xs font-semibold mb-1">사번</label><input type="text" id="fId" class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm"></div>
            <div><label class="block text-xs font-semibold mb-1">성명(한글)</label><input type="text" id="fName" class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm"></div>
            <div><label class="block text-xs font-semibold mb-1">사내호칭(외국인)</label><input type="text" id="fNickname" class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm"></div>
            <div><label class="block text-xs font-semibold mb-1">부서</label><input type="text" id="fDept" class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm"></div>
            <div><label class="block text-xs font-semibold mb-1">공정</label><input type="text" id="fProcess" class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm"></div>
            <div><label class="block text-xs font-semibold mb-1">직위</label><input type="text" id="fRank" class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm"></div>
            <div><label class="block text-xs font-semibold mb-1">주민등록/외국인번호</label><input type="text" id="fRegNo" class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm" placeholder="000000-0000000"></div>
            <div><label class="block text-xs font-semibold mb-1">입사일</label><input type="date" id="fDate" class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm"></div>
            <div><label class="block text-xs font-semibold mb-1">재직상태</label><select id="fStatus" class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm bg-white"><option value="재직">재직</option><option value="퇴사">퇴사</option></select></div>
            <div><label class="block text-xs font-semibold mb-1">급여형태</label><input type="text" id="fSalaryType" class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm" placeholder="시급제/연봉제"></div>
        </div>
        <div class="flex gap-3 mt-6">
            <button onclick="closeForm()" class="flex-1 py-3 font-bold text-slate-500 hover:bg-slate-100 rounded-xl text-xs">취소</button>
            <button onclick="saveEmployeeData()" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold shadow-md hover:bg-blue-700 text-xs">저장하기</button>
        </div>
    </div>
</div>

<script>
    let dbData = { employees: [], salary: [], vacation: [], discipline: [] };
    let isMasked = true;

    window.onload = function() {
        const savedUser = localStorage.getItem('cenit_logged_user');
        if(savedUser) {
            document.getElementById('loginOverlay').classList.add('hidden');
            document.getElementById('currentUserDisplay').innerText = `👤 접속자: ${savedUser} 님`;
            fetchAllData();
        }
    };

    function showLoading(text) {
        document.getElementById('loadingText').innerText = text || "저장 중...";
        document.getElementById('loadingModal').classList.add('show');
    }

    function hideLoading() {
        document.getElementById('loadingModal').classList.remove('show');
    }

    function showCustomAlert(msg) {
        document.getElementById('alertMessageText').innerText = msg;
        document.getElementById('customAlertModal').classList.add('show');
    }

    function closeCustomAlert() {
        document.getElementById('customAlertModal').classList.remove('show');
    }

    async function handleLogin() {
        const id = document.getElementById('loginId').value.trim();
        const pw = document.getElementById('loginPw').value.trim();
        if(!id || !pw) return showCustomAlert('ID와 Password를 입력해주세요.');

        showLoading("로그인 확인 중...");
        try {
            const res = await fetch(GAS_API_URL, { method: "POST", body: JSON.stringify({ action: "login", id, pw }) });
            const result = await res.json();
            hideLoading();
            if(result.success) {
                localStorage.setItem('cenit_logged_user', id);
                document.getElementById('loginOverlay').classList.add('hidden');
                document.getElementById('currentUserDisplay').innerText = `👤 접속자: ${id} 님`;
                fetchAllData();
            } else {
                showCustomAlert('ID 또는 Password가 일치하지 않습니다.');
            }
        } catch(e) {
            hideLoading();
            showCustomAlert('통신 오류가 발생했습니다.');
        }
    }

    function handleLogout() {
        localStorage.removeItem('cenit_logged_user');
        document.getElementById('loginId').value = "";
        document.getElementById('loginPw').value = "";
        document.getElementById('loginOverlay').classList.remove('hidden');
    }

    async function fetchAllData() {
        showLoading("데이터 동기화 중...");
        try {
            const res = await fetch(GAS_API_URL);
            dbData = await res.json();
            hideLoading();
            populateDeptFilter();
            renderAllTables();
        } catch(e) {
            hideLoading();
            console.error(e);
        }
    }

    function populateDeptFilter() {
        const deptSelect = document.getElementById('deptFilter');
        const depts = new Set();
        (dbData.employees || []).forEach(emp => {
            if(emp.부서) depts.add(emp.부서);
        });
        deptSelect.innerHTML = '<option value="전체">전체</option>';
        depts.forEach(d => {
            deptSelect.innerHTML += `<option value="${d}">${d}</option>`;
        });
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-' + tabId).classList.add('active');
        document.getElementById('btn-' + tabId).classList.add('active');

        const floatingBtn = document.getElementById('floatingAddBtn');
        if(tabId === 'emp') {
            floatingBtn.style.display = 'flex';
        } else {
            floatingBtn.style.display = 'none';
        }
    }

    function renderAllTables() {
        renderEmpTable();

        // 2. 급여관리
        const salBody = document.getElementById('salaryTableBody');
        salBody.innerHTML = '';
        if(!dbData.salary || dbData.salary.length === 0) {
            salBody.innerHTML = `<tr><td colspan="10" class="p-12 text-slate-400 text-center font-medium">데이터가 없습니다.</td></tr>`;
        } else {
            dbData.salary.forEach(s => {
                salBody.innerHTML += `
                    <tr class="hover:bg-slate-50">
                        <td class="p-4 font-bold">${s.사번 || ''}</td>
                        <td class="p-4">${s.성명 || ''}</td>
                        <td class="p-4">${s.귀속연월 || ''}</td>
                        <td class="p-4">${s.급여형태 || ''}</td>
                        <td class="p-4 font-bold text-blue-600">${s.기본급 ? Number(s.기본급).toLocaleString() + '원' : ''}</td>
                        <td class="p-4">${s.연장근로수당 ? Number(s.연장근로수당).toLocaleString() + '원' : ''}</td>
                        <td class="p-4">${s.야간근로수당 ? Number(s.야간근로수당).toLocaleString() + '원' : ''}</td>
                        <td class="p-4">${s.휴일근로수당 ? Number(s.휴일근로수당).toLocaleString() + '원' : ''}</td>
                        <td class="p-4">${s.직책수당 ? Number(s.직책수당).toLocaleString() + '원' : ''}</td>
                        <td class="p-4 font-black text-emerald-600">${s.지급총액 ? Number(s.지급총액).toLocaleString() + '원' : ''}</td>
                    </tr>`;
            });
        }

        // 3. 휴가관리
        const vacBody = document.getElementById('vacationTableBody');
        vacBody.innerHTML = '';
        if(!dbData.vacation || dbData.vacation.length === 0) {
            vacBody.innerHTML = `<tr><td colspan="8" class="p-12 text-slate-400 text-center font-medium">데이터가 없습니다.</td></tr>`;
        } else {
            dbData.vacation.forEach(v => {
                vacBody.innerHTML += `
                    <tr class="hover:bg-slate-50">
                        <td class="p-4 font-bold">${v.사번 || ''}</td>
                        <td class="p-4">${v.성명 || ''}</td>
                        <td class="p-4">${v.귀속연도 || ''}</td>
                        <td class="p-4"><span class="bg-indigo-50 text-indigo-600 px-2 py-1 rounded-md text-xs font-bold">${v.휴가구분 || ''}</span></td>
                        <td class="p-4 font-bold">${v.사용시간 ? v.사용시간 + '일' : ''}</td>
                        <td class="p-4 text-xs">${v.휴가시작일 ? String(v.휴가시작일).split('T')[0] : ''}</td>
                        <td class="p-4 text-xs">${v.휴가종료일 ? String(v.휴가종료일).split('T')[0] : ''}</td>
                        <td class="p-4 text-left text-xs">${v.휴가사유 || ''}</td>
                    </tr>`;
            });
        }

        // 4. 징계/포상
        const disBody = document.getElementById('disciplineTableBody');
        disBody.innerHTML = '';
        if(!dbData.discipline || dbData.discipline.length === 0) {
            disBody.innerHTML = `<tr><td colspan="7" class="p-12 text-slate-400 text-center font-medium">데이터가 없습니다.</td></tr>`;
        } else {
            dbData.discipline.forEach(d => {
                disBody.innerHTML += `
                    <tr class="hover:bg-slate-50">
                        <td class="p-4 font-bold">${d.사번 || ''}</td>
                        <td class="p-4">${d.성명 || ''}</td>
                        <td class="p-4"><span class="px-2 py-1 rounded-md text-xs font-bold ${d.구분 === '포상' ? 'bg-blue-50 text-blue-600' : (d.구분 === '징계' ? 'bg-rose-50 text-rose-600' : '')}">${d.구분 || ''}</span></td>
                        <td class="p-4">${d.종류 || ''}</td>
                        <td class="p-4 text-xs">${d.처분일자 ? String(d.처분일자).split('T')[0] : ''}</td>
                        <td class="p-4 text-left text-xs">${d.사유 || ''}</td>
                        <td class="p-4 text-left text-xs">${d.조치내용 || ''}</td>
                    </tr>`;
            });
        }
    }

    function renderEmpTable() {
        const empBody = document.getElementById('empTableBody');
        empBody.innerHTML = '';

        if(!dbData.employees || dbData.employees.length === 0) {
            empBody.innerHTML = `<tr><td colspan="7" class="p-12 text-slate-400 text-center font-medium">데이터가 없습니다.</td></tr>`;
            return;
        }

        const selectedDept = document.getElementById('deptFilter').value;
        const excludeResigned = document.getElementById('excludeResigned').checked;
        const sortCriteria = document.getElementById('sortCriteria').value;

        // 필터링
        let list = dbData.employees.filter(emp => {
            if(selectedDept !== '전체' && emp.부서 !== selectedDept) return false;
            if(excludeResigned && emp.재직상태 === '퇴사') return false;
            return true;
        });

        // 정렬
        list.sort((a, b) => {
            if(sortCriteria === 'name') {
                const nameA = a['성명(한글)'] || a['사내호칭'] || '';
                const nameB = b['성명(한글)'] || b['사내호칭'] || '';
                return nameA.localeCompare(nameB, 'ko');
            } else if(sortCriteria === 'hireDate') {
                return (a.입사일 || '').localeCompare(b.입사일 || '');
            } else if(sortCriteria === 'empId') {
                return String(a.사번 || '').localeCompare(String(b.사번 || ''));
            }
        });

        if(list.length === 0) {
            empBody.innerHTML = `<tr><td colspan="7" class="p-12 text-slate-400 text-center font-medium">조건에 해당되는 데이터가 없습니다.</td></tr>`;
            return;
        }

        list.forEach((emp, idx) => {
            // 외국인은 사내호칭 대체 출력
            const name = emp['성명(한글)'] || emp['사내호칭'] || '-';
            const dept = emp.부서 || '-';
            const process = emp.공정 || '-';
            const rank = emp.직위 || '-';

            let regNo = emp['주민등록번호/외국인등록번호'] || "";
            if(isMasked && regNo !== "" && regNo.length >= 8) {
                regNo = regNo.substring(0, 8) + "******";
            }

            empBody.innerHTML += `
                <tr class="hover:bg-slate-50">
                    <td class="p-4 font-bold text-slate-900">${emp.사번 || ''}</td>
                    <td class="p-4 text-left pl-8">
                        <div class="font-black text-blue-600 text-base mb-0.5">${name}</div>
                        <div class="text-xs text-slate-400 font-semibold">${dept} / ${process} / ${rank}</div>
                    </td>
                    <td class="p-4 font-mono">${regNo}</td>
                    <td class="p-4 text-xs text-slate-500">${emp.입사일 ? String(emp.입사일).split('T')[0] : ''}</td>
                    <td class="p-4"><span class="px-2.5 py-1 rounded-md text-xs font-bold ${emp.재직상태 === '재직' ? 'bg-emerald-50 text-emerald-600' : (emp.재직상태 ? 'bg-rose-50 text-rose-600' : '')}">${emp.재직상태 || ''}</span></td>
                    <td class="p-4 text-xs">${emp.급여형태 || ''}</td>
                    <td class="p-4"><button onclick="openFormByEmpId('${emp.사번}')" class="text-blue-600 hover:bg-blue-50 px-3 py-1.5 rounded-lg text-xs font-bold">수정</button></td>
                </tr>`;
        });
    }

    function toggleMask() {
        isMasked = !isMasked;
        const btn = document.getElementById('maskBtn');
        if(isMasked) {
            btn.className = "bg-rose-600 text-white px-4 py-2 rounded-xl font-bold text-xs shadow-sm";
            btn.innerText = "🔒 보안 적용 (ON)";
        } else {
            btn.className = "bg-emerald-600 text-white px-4 py-2 rounded-xl font-bold text-xs shadow-sm";
            btn.innerText = "🔓 보안 해제 (OFF)";
        }
        renderAllTables();
    }

    function openFormByEmpId(empId) {
        const idx = dbData.employees.findIndex(e => String(e.사번) === String(empId));
        openForm(idx);
    }

    function openForm(idx) {
        document.getElementById('hrModal').classList.add('show');
        if(idx === -1) {
            document.getElementById('formTitle').innerText = "신규 입사자 등록";
            document.getElementById('fId').value = "";
            document.getElementById('fName').value = "";
            document.getElementById('fNickname').value = "";
            document.getElementById('fDept').value = "";
            document.getElementById('fProcess').value = "";
            document.getElementById('fRank').value = "";
            document.getElementById('fRegNo').value = "";
            document.getElementById('fDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('fStatus').value = "재직";
            document.getElementById('fSalaryType').value = "시급제";
            document.getElementById('fId').disabled = false;
        } else {
            const e = dbData.employees[idx];
            document.getElementById('formTitle').innerText = `${e['성명(한글)'] || e['사내호칭']} 정보 수정`;
            document.getElementById('fId').value = e.사번 || "";
            document.getElementById('fName').value = e['성명(한글)'] || "";
            document.getElementById('fNickname').value = e['사내호칭'] || "";
            document.getElementById('fDept').value = e.부서 || "";
            document.getElementById('fProcess').value = e.공정 || "";
            document.getElementById('fRank').value = e.직위 || "";
            document.getElementById('fRegNo').value = e['주민등록번호/외국인등록번호'] || "";
            document.getElementById('fDate').value = e.입사일 ? String(e.입사일).split('T')[0] : "";
            document.getElementById('fStatus').value = e.재직상태 || "재직";
            document.getElementById('fSalaryType').value = e.급여형태 || "시급제";
            document.getElementById('fId').disabled = true;
        }
    }

    function closeForm() { document.getElementById('hrModal').classList.remove('show'); }

    async function saveEmployeeData() {
        const empData = {
            사번: document.getElementById('fId').value,
            부서: document.getElementById('fDept').value,
            공정: document.getElementById('fProcess').value,
            직위: document.getElementById('fRank').value,
            "성명(한글)": document.getElementById('fName').value,
            "사내호칭": document.getElementById('fNickname').value,
            "주민등록번호/외국인등록번호": document.getElementById('fRegNo').value,
            입사일: document.getElementById('fDate').value,
            재직상태: document.getElementById('fStatus').value,
            급여형태: document.getElementById('fSalaryType').value
        };

        if(!empData.사번 || (!empData["성명(한글)"] && !empData["사내호칭"])) {
            return showCustomAlert("사번과 성명(한글) 또는 사내호칭은 필수 입력 항목입니다.");
        }

        closeForm();
        showLoading("저장 중...");

        try {
            const res = await fetch(GAS_API_URL, {
                method: "POST",
                body: JSON.stringify({ action: "saveEmployee", data: empData })
            });
            const result = await res.json();
            hideLoading();
            if(result.success) {
                showCustomAlert('성공적으로 저장되었습니다.');
                fetchAllData();
            } else {
                showCustomAlert('저장 실패: ' + result.error);
            }
        } catch(e) {
            hideLoading();
            showCustomAlert('통신 중 오류가 발생했습니다.');
        }
    }
</script>
</body>
</html>
